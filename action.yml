name: 'Setup xdrun'
description: 'Install and setup xdrun - a declarative task runner for DevOps workflows'
author: 'phillarmonic'

branding:
  icon: 'play'
  color: 'blue'

inputs:
  version:
    description: 'Version of xdrun to install (e.g., "v2", "v2.0.0", "latest")'
    required: false
    default: 'latest'
  
  token:
    description: 'GitHub token for API requests (to avoid rate limiting)'
    required: false
    default: ${{ github.token }}
  
  cache:
    description: 'Enable caching of downloaded binaries'
    required: false
    default: 'true'

outputs:
  version:
    description: 'The version of xdrun that was installed'
    value: ${{ steps.install.outputs.version }}
  
  path:
    description: 'Path to the installed xdrun binary'
    value: ${{ steps.install.outputs.path }}
  
  cache-hit:
    description: 'Whether the binary was restored from cache'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Configure Git line endings (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
        git config --global core.safecrlf warn
    - name: Determine platform and architecture
      id: platform
      shell: bash
      run: |
        # Determine OS
        case "${{ runner.os }}" in
          Linux)
            os="linux"
            ;;
          macOS)
            os="darwin"
            ;;
          Windows)
            os="windows"
            ;;
          *)
            echo "::error::Unsupported operating system: ${{ runner.os }}"
            exit 1
            ;;
        esac
        
        # Determine architecture
        case "${{ runner.arch }}" in
          X64)
            arch="amd64"
            ;;
          ARM64)
            arch="arm64"
            ;;
          *)
            echo "::error::Unsupported architecture: ${{ runner.arch }}"
            exit 1
            ;;
        esac
        
        # Set binary name
        if [[ "$os" == "windows" ]]; then
          binary_name="xdrun-${os}-${arch}.exe"
          executable_name="xdrun.exe"
        else
          binary_name="xdrun-${os}-${arch}"
          executable_name="xdrun"
        fi
        
        echo "os=$os" >> $GITHUB_OUTPUT
        echo "arch=$arch" >> $GITHUB_OUTPUT
        echo "binary-name=$binary_name" >> $GITHUB_OUTPUT
        echo "executable-name=$executable_name" >> $GITHUB_OUTPUT
        echo "platform=${os}-${arch}" >> $GITHUB_OUTPUT

    - name: Resolve version
      id: version
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        requested_version="${{ inputs.version }}"

        if [[ "$requested_version" == "latest" ]]; then
          echo "Fetching latest release version..."
          latest_version=$(curl -sSf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/phillarmonic/drun/releases/latest" \
            | jq -r '.tag_name')
          
          if [[ -z "$latest_version" || "$latest_version" == "null" ]]; then
            echo "::error::Failed to fetch latest version"
            exit 1
          fi
          
          echo "version=$latest_version" >> $GITHUB_OUTPUT
          echo "Latest version: $latest_version"
        elif [[ "$requested_version" =~ ^v[0-9]+$ || "$requested_version" =~ ^v[0-9]+\.[0-9]+$ ]]; then
          echo "Resolving release prefix: $requested_version"
          if [[ "$requested_version" =~ ^v[0-9]+$ ]]; then
            version_pattern="^${requested_version//./\\.}\\.[0-9]+\\.[0-9]+$"
          else
            version_pattern="^${requested_version//./\\.}\\.[0-9]+$"
          fi

          matching_version=$(curl -sSf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/phillarmonic/drun/releases?per_page=100" \
            | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -E "$version_pattern" \
            | sort -V \
            | tail -n 1)

          if [[ -z "$matching_version" ]]; then
            echo "::error::Failed to resolve version prefix: $requested_version"
            echo "::error::Please check available releases: https://github.com/phillarmonic/drun/releases"
            exit 1
          fi

          echo "version=$matching_version" >> $GITHUB_OUTPUT
          echo "Resolved $requested_version to $matching_version"
        else
          echo "version=$requested_version" >> $GITHUB_OUTPUT
          echo "Using specified version: $requested_version"
        fi

    - name: Setup cache
      id: cache
      if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/xdrun-${{ steps.platform.outputs.platform }}
        key: xdrun-${{ steps.version.outputs.version }}-${{ steps.platform.outputs.platform }}
        restore-keys: |
          xdrun-${{ steps.version.outputs.version }}-${{ steps.platform.outputs.platform }}

    - name: Download and install xdrun
      id: install
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        version="${{ steps.version.outputs.version }}"
        binary_name="${{ steps.platform.outputs.binary-name }}"
        executable_name="${{ steps.platform.outputs.executable-name }}"
        platform="${{ steps.platform.outputs.platform }}"
        
        # Set installation directory
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          install_dir="${{ runner.temp }}/xdrun-bin"
        else
          install_dir="${{ runner.temp }}/xdrun-bin"
        fi
        
        mkdir -p "$install_dir"
        binary_path="$install_dir/$executable_name"
        
        # Check if binary exists in cache
        cache_path="${{ runner.temp }}/xdrun-$platform"
        if [[ "${{ inputs.cache }}" == "true" && -f "$cache_path" ]]; then
          echo "Using cached binary..."
          cp "$cache_path" "$binary_path"
          chmod +x "$binary_path"
        else
          echo "Downloading xdrun $version for $platform..."
          download_url="https://github.com/phillarmonic/drun/releases/download/$version/$binary_name"
          
          echo "Download URL: $download_url"
          
          # Download binary
          if ! curl -sSfL "$download_url" -o "$binary_path"; then
            echo "::error::Failed to download xdrun binary from $download_url"
            echo "::error::Please check if the release exists: https://github.com/phillarmonic/drun/releases/tag/$version"
            exit 1
          fi
          
          # Make executable
          chmod +x "$binary_path"
          
          # Cache the binary if caching is enabled
          if [[ "${{ inputs.cache }}" == "true" ]]; then
            cp "$binary_path" "$cache_path"
          fi
        fi
        
        # Verify installation
        echo "Verifying installation..."
        if ! "$binary_path" --version; then
          echo "::error::Downloaded binary failed verification"
          exit 1
        fi
        
        # Add to PATH
        echo "$install_dir" >> $GITHUB_PATH
        
        # Set outputs
        installed_version=$("$binary_path" --version | grep "Version" | awk '{print $2}' || echo "$version")
        echo "version=$installed_version" >> $GITHUB_OUTPUT
        echo "path=$binary_path" >> $GITHUB_OUTPUT
        
        echo "xdrun $installed_version installed successfully."
        echo "Installed to: $binary_path"
        echo "Added to PATH: $install_dir"

    - name: Verify xdrun is available
      shell: bash
      run: |
        echo "Verifying xdrun is available in PATH..."
        if command -v xdrun >/dev/null 2>&1; then
          echo "xdrun is available in PATH."
          xdrun --version
        else
          echo "::error::xdrun is not available in PATH"
          exit 1
        fi
