name: Test Setup xdrun Action

on:
  push:
    branches: [ main, master ]
    paths:
      - 'action.yml'
      - '.github/workflows/test-action.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'action.yml'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:

jobs:
  test-platforms:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Test setup xdrun (latest)
        uses: ./
        id: setup-latest
        with:
          version: 'latest'
      
      - name: Verify xdrun installation
        shell: bash
        run: |
          echo "Testing xdrun installation..."
          
          # Check if xdrun is in PATH
          if ! command -v xdrun >/dev/null 2>&1; then
            echo "xdrun not found in PATH"
            exit 1
          fi
          
          # Check version
          echo "xdrun found in PATH"
          xdrun --version
          
          # Verify outputs
          echo "Action outputs:"
          echo "  Version: ${{ steps.setup-latest.outputs.version }}"
          echo "  Path: ${{ steps.setup-latest.outputs.path }}"
          echo "  Cache hit: ${{ steps.setup-latest.outputs.cache-hit }}"
          
          # Test basic functionality
          echo "Testing basic functionality..."
          xdrun --help >/dev/null
          echo "xdrun --help works"
      
      - name: Test with example xdrun file
        shell: bash
        run: |
          # Create a simple test xdrun file in correct location
          mkdir -p .drun
          cat > .drun/spec.drun << 'EOF'
          # Simple test xdrun file
          version: 2.0
          
          project "test-project" version "1.0":
            set platform to "${{ matrix.os }}"
          
          task "hello" means "Say hello from xdrun":
            info "Hello from xdrun on {$globals.platform}"
          
          task "version" means "Show xdrun version":
            run "xdrun --version"
          EOF
          
          echo "Testing xdrun execution..."
          xdrun hello
          xdrun version

  test-versions:
    name: Test version ${{ matrix.version }} on Ubuntu
    strategy:
      fail-fast: false
      matrix:
        version: ['latest']  # Add specific versions here when available
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Test setup xdrun (${{ matrix.version }})
        uses: ./
        id: setup-version
        with:
          version: ${{ matrix.version }}
      
      - name: Verify installation
        run: |
          echo "Testing xdrun ${{ matrix.version }}..."
          xdrun --version
          echo "Version test passed"

  test-caching:
    name: Test caching functionality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: First installation (should download)
        uses: ./
        id: first-install
        with:
          version: 'latest'
          cache: 'true'
      
      - name: Verify first installation
        run: |
          echo "First install cache hit: ${{ steps.first-install.outputs.cache-hit }}"
          xdrun --version
      
      - name: Second installation (should use cache)
        uses: ./
        id: second-install
        with:
          version: 'latest'
          cache: 'true'
      
      - name: Verify caching worked
        run: |
          echo "Second install cache hit: ${{ steps.second-install.outputs.cache-hit }}"
          xdrun --version
          
          # Note: Cache hit might still be false on first run due to GitHub Actions cache behavior
          echo "Caching test completed"

  test-no-cache:
    name: Test without caching
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Install without cache
        uses: ./
        id: no-cache
        with:
          version: 'latest'
          cache: 'false'
      
      - name: Verify installation
        run: |
          echo "Cache disabled - cache hit: ${{ steps.no-cache.outputs.cache-hit }}"
          xdrun --version
          echo "No-cache test passed"

  test-custom-token:
    name: Test with custom token
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Install with custom token
        uses: ./
        id: custom-token
        with:
          version: 'latest'
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify installation
        run: |
          xdrun --version
          echo "Custom token test passed"

  integration-test:
    name: Integration test with real xdrun workflow
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup xdrun
        uses: ./
        with:
          version: 'latest'
      
      - name: Create comprehensive test workflow
        run: |
          mkdir -p .drun
          cat > .drun/spec.drun << 'EOF'
          # Integration test xdrun file
          version: 2.0
          
          project "integration-test" version "1.0":
            set test_dir to "test-output"
            set build_id to "build-123"
          
          task "setup" means "Setup test environment":
            info "Setting up test environment..."
            run "mkdir -p {$globals.test_dir}"
            run "echo 'Setup complete at $(date)' > {$globals.test_dir}/setup.txt"
            run "echo 'Project: {$globals.project} v{$globals.version}' >> {$globals.test_dir}/setup.txt"
            success "Setup complete"
          
          task "test" means "Run tests":
            info "Running tests..."
            run "echo 'Running test suite for build {$globals.build_id}'"
            run "echo 'Test passed at $(date)' > {$globals.test_dir}/test.txt"
            run "cat {$globals.test_dir}/setup.txt"
            success "Tests completed"
          
          task "build" means "Build application":
            info "Building application..."
            run "echo 'Building {$globals.project} version {$globals.version}'"
            run "echo 'Build {$globals.build_id} complete at $(date)' > {$globals.test_dir}/build.txt"
            success "Build successful"
          
          task "verify" means "Verify all components":
            info "Verifying all components..."
            run "ls -la {$globals.test_dir}/"
            run "echo 'Files created:'"
            run "find {$globals.test_dir} -type f -exec basename {} \;"
            success "Verification complete"
          
          task "cleanup" means "Clean up test files":
            info "Cleaning up test directory: {$globals.test_dir}"
            run "rm -rf {$globals.test_dir}"
            success "Cleanup complete"
          EOF

      - name: Run integration test
        run: |
          echo "Running integration test..."
          echo "Testing individual tasks..."
          xdrun setup
          xdrun test
          xdrun build
          xdrun verify
          xdrun cleanup
          echo "Integration test passed"

  summary:
    name: Test Summary
    needs: [test-platforms, test-versions, test-caching, test-no-cache, test-custom-token, integration-test]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Test Results Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.test-platforms.result }}" == "success" ]]; then
            echo "Platform tests: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "Platform tests: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.test-versions.result }}" == "success" ]]; then
            echo "Version tests: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "Version tests: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.test-caching.result }}" == "success" ]]; then
            echo "Caching tests: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "Caching tests: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.test-no-cache.result }}" == "success" ]]; then
            echo "No-cache tests: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "No-cache tests: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.test-custom-token.result }}" == "success" ]]; then
            echo "Custom token tests: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "Custom token tests: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.integration-test.result }}" == "success" ]]; then
            echo "Integration tests: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "Integration tests: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Setup xdrun GitHub Action testing completed." >> $GITHUB_STEP_SUMMARY
